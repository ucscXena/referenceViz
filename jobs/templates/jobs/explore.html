{% extends "base.html" %}
{% load static %}

{% block title %}References — UCSC Brain Explorer{% endblock %}

{% block extra_head %}
<link rel="stylesheet" href="{% static 'css/pages/explore.css' %}">
{% endblock %}

{% block base_content %}
<div class="explore-root">

  <aside class="explore-sidebar">
   <div class="sidebar-inner">
    <div class="sidebar-top">
      <h2>Filters</h2>
      <button class="sidebar-clear" id="filter-clear">Clear All</button>
      <button type="button" class="sidebar-gear" id="filter-sort-button" aria-label="Sort filter values" aria-haspopup="menu" aria-expanded="false">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M19.43 12.98c.04-.32.07-.64.07-.98s-.03-.66-.07-.98l2.11-1.65c.19-.15.24-.42.12-.64l-2-3.46c-.09-.16-.26-.25-.44-.25-.06 0-.12.01-.17.03l-2.49 1c-.52-.4-1.08-.73-1.69-.98l-.38-2.65C14.46 2.18 14.25 2 14 2h-4c-.25 0-.46.18-.49.42l-.38 2.65c-.61.25-1.17.59-1.69.98l-2.49-1q-.09-.03-.18-.03c-.17 0-.34.09-.43.25l-2 3.46c-.13.22-.07.49.12.64l2.11 1.65c-.04.32-.07.65-.07.98s.03.66.07.98l-2.11 1.65c-.19.15-.24.42-.12.64l2 3.46c.09.16.26.25.44.25.06 0 .12-.01.17-.03l2.49-1c.52.4 1.08.73 1.69.98l.38 2.65c.03.24.24.42.49.42h4c.25 0 .46-.18.49-.42l.38-2.65c.61-.25 1.17-.59 1.69-.98l2.49 1q.09.03.18.03c.17 0 .34-.09.43-.25l2-3.46c.12-.22.07-.49-.12-.64zm-1.98-1.71c.04.31.05.52.05.73s-.02.43-.05.73l-.14 1.13.89.7 1.08.84-.7 1.21-1.27-.51-1.04-.42-.9.68c-.43.32-.84.56-1.25.73l-1.06.43-.16 1.13-.2 1.35h-1.4l-.19-1.35-.16-1.13-1.06-.43c-.43-.18-.83-.41-1.23-.71l-.91-.7-1.06.43-1.27.51-.7-1.21 1.08-.84.89-.7-.14-1.13c-.03-.31-.05-.54-.05-.74s.02-.43.05-.73l.14-1.13-.89-.7-1.08-.84.7-1.21 1.27.51 1.04.42.9-.68c.43-.32.84-.56 1.25-.73l1.06-.43.16-1.13.2-1.35h1.39l.19 1.35.16 1.13 1.06.43c.43.18.83.41 1.23.71l.91.7 1.06-.43 1.27-.51.7 1.21-1.07.85-.89.7zM12 8c-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4-1.79-4-4-4m0 6c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2"/>
        </svg>
      </button>
    </div>
    <div class="sidebar-search-wrap" id="filter-search">
      <svg class="sidebar-search-icon" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path d="M15.8599 17.0728L11.2969 12.5098C10.8389 12.8571 10.3422 13.1178 9.80688 13.2918C9.27221 13.4651 8.71321 13.5518 8.12988 13.5518C6.61654 13.5518 5.32854 13.0274 4.26587 11.9788C3.20321 10.9301 2.67188 9.64876 2.67188 8.13476C2.67188 6.62142 3.20321 5.33342 4.26587 4.27076C5.32854 3.20809 6.61654 2.67676 8.12988 2.67676C9.64388 2.67676 10.9252 3.20809 11.9739 4.27076C13.0225 5.33342 13.5469 6.62142 13.5469 8.13476C13.5469 8.71809 13.4635 9.27709 13.2969 9.81176C13.1302 10.3471 12.8662 10.8368 12.5049 11.2808L17.0889 15.8848C17.2555 16.0514 17.3352 16.2494 17.3279 16.4788C17.3212 16.7081 17.2345 16.9061 17.0679 17.0728C16.9012 17.2394 16.6999 17.3228 16.4639 17.3228C16.2279 17.3228 16.0265 17.2394 15.8599 17.0728ZM8.12988 11.8018C9.14388 11.8018 10.0085 11.4441 10.7239 10.7288C11.4392 10.0134 11.7969 9.14876 11.7969 8.13476C11.7969 7.10742 11.4425 6.23242 10.7339 5.50976C10.0259 4.78776 9.15788 4.42676 8.12988 4.42676C7.10254 4.42676 6.22754 4.78776 5.50488 5.50976C4.78288 6.23242 4.42188 7.10742 4.42188 8.13476C4.42188 9.16276 4.78288 10.0308 5.50488 10.7388C6.22754 11.4474 7.10254 11.8018 8.12988 11.8018Z"/></svg>
      <input class="sidebar-search" type="text" id="filter-search-input" role="combobox"
             aria-label="Search all filters" aria-autocomplete="list" aria-expanded="false"
             aria-controls="filter-search-panel" placeholder="Search all filters..."
             autocomplete="off" autocapitalize="none" spellcheck="false">
      <button type="button" class="sidebar-search-clear" id="filter-search-clear" aria-label="Clear search">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M18.3 5.71a.996.996 0 0 0-1.41 0L12 10.59 7.11 5.7a.996.996 0 0 0-1.41 0c-.39.39-.39 1.02 0 1.41L10.59 12 5.7 16.89c-.39.39-.39 1.02 0 1.41s1.02.39 1.41 0L12 13.41l4.89 4.89c.39.39 1.02.39 1.41 0s.39-1.02 0-1.41L13.41 12l4.89-4.89c.38-.38.38-1.02 0-1.4"/></svg>
      </button>
    </div>

    <div class="filter-list" id="filter-list"></div>
   </div>
  </aside>

  <div class="overlay sidebar-overlay" id="sidebar-overlay"></div>

  <main class="explore-main">
    <h1>References <button class="button-outline mobile-filter-btn" id="mobile-filter-toggle"><svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M11 18h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1M3 7c0 .55.45 1 1 1h16c.55 0 1-.45 1-1s-.45-1-1-1H4c-.55 0-1 .45-1 1m4 6h10c.55 0 1-.45 1-1s-.45-1-1-1H7c-.55 0-1 .45-1 1s.45 1 1 1"/></svg>Filter</button></h1>
    <div class="ref-grid" id="ref-grid">
      {% comment %}Rendered by JS{% endcomment %}
    </div>
  </main>

</div>

<script>
const REFS = {{ refs_data_json|safe }};

function buildCard(ref) {
  const card = document.createElement('article');
  card.className = 'paper ref-card';
  card.dataset.id = ref.id;

  const imgHtml = ref.has_image
    ? `<img src="/jobs/references/${ref.reference_id}/image/" alt="Reference visualization for ${ref.title}" loading="lazy">`
    : `<span class="ref-no-image">◉</span>`;

  card.innerHTML = `
    <a class="ref-card-link" href="/references/${ref.reference_id}/">
      <div class="ref-image-wrap">${imgHtml}</div>
      <div class="ref-card-footer">
        <span class="ref-card-title">${ref.title}</span>
      </div>
    </a>`;
  return card;
}

const grid = document.getElementById('ref-grid');
REFS.forEach(ref => grid.appendChild(buildCard(ref)));

// ── Facets ──────────────────────────────────────────────────
// Selecting nothing in a facet means "no filter". Values OR within a facet and
// AND across facets. A facet's counts come from the references that pass every
// *other* facet, so selecting in one facet narrows the others but not itself.
const FACETS = [
  {key: 'organism', label: 'Species'},
  {key: 'cell_type', label: 'Cell Type'},
  {key: 'tissue', label: 'Tissue'},
];
const MAX_UNSEARCHED_VALUES = 8;
const FILTER_SORTS = [
  {key: 'alpha', label: 'Alphabetical'},
  {key: 'count', label: 'By Count (Descending)'},
];
const selected = Object.fromEntries(FACETS.map(f => [f.key, new Set()]));
let filterSort = 'count';
const collator = new Intl.Collator('en', {numeric: true, sensitivity: 'base'});
const SVG_NS = 'http://www.w3.org/2000/svg';
const CHEVRON_PATH = 'm8.71 11.71 2.59 2.59c.39.39 1.02.39 1.41 0l2.59-2.59c.63-.63.18-1.71-.71-1.71H9.41c-.89 0-1.33 1.08-.7 1.71';
const CLOSE_PATH = 'M18.3 5.71a.996.996 0 0 0-1.41 0L12 10.59 7.11 5.7a.996.996 0 0 0-1.41 0c-.39.39-.39 1.02 0 1.41L10.59 12 5.7 16.89c-.39.39-.39 1.02 0 1.41s1.02.39 1.41 0L12 13.41l4.89 4.89c.39.39 1.02.39 1.41 0s.39-1.02 0-1.41L13.41 12l4.89-4.89c.38-.38.38-1.02 0-1.4';
const SEARCH_PATH = document.querySelector('.sidebar-search-icon path').getAttribute('d');

function svgIcon(d, viewBox = '0 0 24 24', className = '') {
  const svg = document.createElementNS(SVG_NS, 'svg');
  svg.setAttribute('viewBox', viewBox);
  svg.setAttribute('aria-hidden', 'true');
  if (className) svg.setAttribute('class', className);
  const path = document.createElementNS(SVG_NS, 'path');
  path.setAttribute('d', d);
  svg.appendChild(path);
  return svg;
}

function checkboxIcon(checked) {
  const tpl = document.createElement('template');
  tpl.innerHTML = checked
    ? '<svg class="filter-check filter-check-on" viewBox="0 0 18 18" aria-hidden="true"><rect width="18" height="18" rx="4" fill="currentColor"/><path fill="#fff" d="M7.84875 12.188C7.96008 12.188 8.06775 12.167 8.17175 12.125C8.27575 12.083 8.37641 12.0137 8.47375 11.917L13.0987 7.29201C13.2654 7.12535 13.3521 6.92401 13.3587 6.68801C13.3661 6.45135 13.2794 6.24268 13.0987 6.06201C12.9321 5.89535 12.7271 5.81201 12.4837 5.81201C12.2411 5.81201 12.0364 5.89535 11.8697 6.06201L7.84875 10.083L6.09875 8.33301C5.93208 8.16635 5.73408 8.07968 5.50475 8.07301C5.27608 8.06568 5.07141 8.15235 4.89075 8.33301C4.72408 8.49968 4.64075 8.70468 4.64075 8.94801C4.64075 9.19068 4.72408 9.39535 4.89075 9.56201L7.22375 11.917C7.32108 12.0137 7.42175 12.083 7.52575 12.125C7.62975 12.167 7.73741 12.188 7.84875 12.188Z"/></svg>'
    : '<svg class="filter-check filter-check-off" viewBox="0 0 18 18" aria-hidden="true"><rect x=".5" y=".5" width="17" height="17" rx="3.5" fill="#fff" stroke="#c4cdd5"/></svg>';
  return tpl.content.firstChild;
}

function passesFacets(ref, exceptKey) {
  return FACETS.every(({key}) =>
    key === exceptKey || !selected[key].size || ref[key].some(v => selected[key].has(v)));
}

// Values for a facet with counts, in the order chosen from the sort menu.
function facetValues(key) {
  const counts = new Map([...selected[key]].map(v => [v, 0]));
  REFS.filter(ref => passesFacets(ref, key)).forEach(ref =>
    new Set(ref[key]).forEach(v => counts.set(v, (counts.get(v) || 0) + 1)));
  return [...counts]
    .map(([label, count]) => ({label, count}))
    .sort((a, b) => (filterSort === 'count' && b.count - a.count) || collator.compare(a.label, b.label));
}

// Every word must match; values containing the whole phrase rank first.
function matchValues(values, term) {
  const words = term.split(/\s+/).filter(Boolean);
  if (!words.length) return values.map(value => ({value, ranges: []}));
  const escape = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  const find = (label, word) =>
    [...label.matchAll(new RegExp(escape(word), 'ig'))].map(m => ({start: m.index, end: m.index + m[0].length}));
  const matches = [];
  values.forEach(value => {
    const perWord = words.map(w => find(value.label, w));
    if (perWord.some(r => !r.length)) return;
    const phrase = find(value.label, term);
    matches.push({value, ranges: [...perWord.flat(), ...phrase], score: phrase.length ? 2 : 1});
  });
  return matches.sort((a, b) => b.score - a.score);
}

function appendHighlighted(parent, label, ranges) {
  const sorted = [...ranges].sort((a, b) => a.start - b.start);
  let prev = 0;
  for (let i = 0; i < sorted.length; i++) {
    const {start} = sorted[i];
    let {end} = sorted[i];
    while (i + 1 < sorted.length && sorted[i + 1].start <= end) {
      i++;
      end = Math.max(end, sorted[i].end);
    }
    parent.append(label.slice(prev, start));
    const mark = document.createElement('mark');
    mark.textContent = label.slice(start, end);
    if (!label[start - 1] || /\s/.test(label[start - 1])) mark.classList.add('left-open');
    if (!label[end] || /\s/.test(label[end])) mark.classList.add('right-open');
    parent.append(mark);
    prev = end;
  }
  parent.append(label.slice(prev));
}

let openFacet = null;  // {key, popover, backdrop, button}

// Page scroll is locked while a menu is open, keeping the layout from shifting.
function lockScroll() {
  const scrollbar = window.innerWidth - document.documentElement.clientWidth;
  document.body.style.overflow = 'hidden';
  document.body.style.paddingRight = `${scrollbar}px`;
}

function unlockScroll() {
  document.body.style.overflow = '';
  document.body.style.paddingRight = '';
}

function renderFacets() {
  const list = document.getElementById('filter-list');
  list.replaceChildren(...FACETS.map(({key, label}) => {
    const section = document.createElement('div');
    section.className = 'filter-section';

    const button = document.createElement('button');
    button.type = 'button';
    button.className = 'filter-label';
    button.dataset.facet = key;
    button.setAttribute('aria-haspopup', 'dialog');
    button.append(`${label} (${facetValues(key).length})`, svgIcon(CHEVRON_PATH, '0 0 24 24', 'filter-chevron'));
    button.classList.toggle('open', openFacet?.key === key);
    button.addEventListener('click', () => showPopover(key));
    section.append(button);

    if (selected[key].size) {
      const tags = document.createElement('div');
      tags.className = 'filter-tags';
      [...selected[key]].forEach(value => {
        const tag = document.createElement('button');
        tag.type = 'button';
        tag.className = 'filter-tag';
        tag.title = value;
        tag.setAttribute('aria-label', `Remove filter ${value}`);
        const text = document.createElement('span');
        text.textContent = value;
        tag.append(text, svgIcon(CLOSE_PATH));
        tag.addEventListener('click', () => toggleValue(key, value, false));
        tags.append(tag);
      });
      section.append(tags);
    }
    return section;
  }));
}

function noResults() {
  const empty = document.createElement('div');
  empty.className = 'filter-no-results';
  const title = document.createElement('strong');
  title.textContent = 'No results found!';
  const hint = document.createElement('p');
  hint.textContent = 'Try adjusting your search or filter to find what you’re looking for.';
  empty.append(title, hint);
  return empty;
}

function valueRow(key, {value, ranges}) {
  const li = document.createElement('li');
  const item = document.createElement('label');
  item.className = 'filter-item';
  const box = document.createElement('input');
  box.type = 'checkbox';
  box.checked = selected[key].has(value.label);
  box.addEventListener('change', () => toggleValue(key, value.label, box.checked));
  const text = document.createElement('span');
  text.className = 'filter-item-text';
  const name = document.createElement('span');
  appendHighlighted(name, value.label, ranges);
  const count = document.createElement('span');
  count.className = 'filter-item-count';
  count.textContent = value.count;
  text.append(name, count);
  item.append(box, checkboxIcon(true), checkboxIcon(false), text);
  li.append(item);
  return li;
}

function renderPopoverList(key, container, term) {
  const matches = matchValues(facetValues(key), term);
  if (!matches.length) {
    const empty = noResults();
    const clear = document.createElement('button');
    clear.type = 'button';
    clear.textContent = 'Clear Search';
    clear.addEventListener('click', () => {
      const input = openFacet.popover.querySelector('input[type=text]');
      input.value = '';
      input.focus();
      renderPopoverList(key, container, '');
    });
    empty.append(clear);
    container.replaceChildren(empty);
    return;
  }
  const ul = document.createElement('ul');
  ul.append(...matches.map(match => valueRow(key, match)));
  container.replaceChildren(ul);
}

function showPopover(key) {
  closePopover();  // re-renders the labels, so look the button up afterwards
  const button = document.querySelector(`.filter-label[data-facet="${key}"]`);
  const rect = button.getBoundingClientRect();

  const backdrop = document.createElement('div');
  backdrop.className = 'filter-backdrop';
  backdrop.addEventListener('click', closePopover);

  const popover = document.createElement('div');
  popover.className = 'popover popover--filter filter-popover';
  popover.setAttribute('role', 'dialog');
  popover.setAttribute('aria-label', FACETS.find(f => f.key === key).label);

  const listEl = document.createElement('div');
  listEl.className = 'filter-popover-list';
  let input = null;
  if (facetValues(key).length > MAX_UNSEARCHED_VALUES) {
    const search = document.createElement('div');
    search.className = 'filter-popover-search';
    input = document.createElement('input');
    input.type = 'text';
    input.placeholder = 'Search';
    input.spellcheck = false;
    input.autocomplete = 'off';
    input.setAttribute('aria-label', 'Search values');
    input.addEventListener('input', () => {
      listEl.scrollTop = 0;
      renderPopoverList(key, listEl, input.value);
    });
    search.append(svgIcon(SEARCH_PATH, '0 0 20 20'), input);
    popover.append(search);
  }
  popover.append(listEl);
  renderPopoverList(key, listEl, '');

  lockScroll();
  document.body.append(backdrop, popover);
  popover.style.left = `${rect.left}px`;
  const top = rect.bottom + 3;  // overlaps the label by 1px, plus a 4px margin
  popover.style.top = `${Math.max(0, Math.min(top, window.innerHeight - popover.offsetHeight - 4))}px`;

  openFacet = {key, popover, backdrop, button};
  button.classList.add('open');
  input?.focus();
}

function closePopover() {
  if (!openFacet) return;
  const {key, popover, backdrop} = openFacet;
  popover.remove();
  backdrop.remove();
  openFacet = null;
  unlockScroll();
  renderFacets();
  // Return focus to the label without the keyboard focus ring; Tab still shows it.
  const label = document.querySelector(`.filter-label[data-facet="${key}"]`);
  label?.classList.add('focus-restored');
  label?.addEventListener('blur', () => label.classList.remove('focus-restored'), {once: true});
  label?.focus();
}

function toggleValue(key, value, on) {
  selected[key][on ? 'add' : 'delete'](value);
  applyFilters();
}

function applyFilters() {
  document.querySelectorAll('.ref-card').forEach(card => {
    const ref = REFS.find(r => r.id === card.dataset.id);
    card.classList.toggle('hidden', !passesFacets(ref));
  });
  renderFacets();
  renderSearchPanel();
}

// ── Filter sort menu ────────────────────────────────────────
const RADIO_ICONS = {
  on: '<svg viewBox="0 0 18 18" aria-hidden="true"><path fill="currentColor" fill-rule="evenodd" clip-rule="evenodd" d="M9 18C13.9706 18 18 13.9707 18 9C18 4.0293 13.9706 0 9 0C4.02942 0 0 4.0293 0 9C0 13.9707 4.02942 18 9 18ZM9 13C11.2091 13 13 11.209 13 9C13 6.79102 11.2091 5 9 5C6.79089 5 5 6.79102 5 9C5 11.209 6.79089 13 9 13Z"/></svg>',
  off: '<svg viewBox="0 0 18 18" aria-hidden="true"><rect fill="transparent" stroke="currentColor" x=".5" y=".5" width="17" height="17" rx="8.5"/></svg>',
};
const sortButton = document.getElementById('filter-sort-button');
let openSortMenu = null;  // {menu, backdrop}

function renderSortOptions(menu) {
  menu.querySelectorAll('.filter-sort-option').forEach(option => {
    const checked = option.dataset.sort === filterSort;
    option.setAttribute('aria-checked', checked);
    option.querySelector('.filter-sort-icon').innerHTML = checked ? RADIO_ICONS.on : RADIO_ICONS.off;
  });
}

function showSortMenu() {
  const backdrop = document.createElement('div');
  backdrop.className = 'filter-backdrop';
  backdrop.addEventListener('click', closeSortMenu);

  const menu = document.createElement('div');
  menu.className = 'popover popover--filter filter-sort-menu';
  menu.setAttribute('role', 'menu');
  menu.setAttribute('aria-label', 'Sort Filter Values By');
  const heading = document.createElement('h3');
  heading.textContent = 'Sort Filter Values By';
  menu.append(heading);
  FILTER_SORTS.forEach(({key, label}) => {
    const option = document.createElement('button');
    option.type = 'button';
    option.className = 'filter-sort-option';
    option.dataset.sort = key;
    option.setAttribute('role', 'menuitemradio');
    const icon = document.createElement('span');
    icon.className = 'filter-sort-icon';
    icon.style.display = 'contents';
    option.append(icon, label);
    option.addEventListener('click', () => {
      filterSort = key;
      renderSortOptions(menu);
    });
    menu.append(option);
  });
  renderSortOptions(menu);

  lockScroll();
  document.body.append(backdrop, menu);
  const rect = sortButton.getBoundingClientRect();
  menu.style.left = `${Math.max(8, Math.min(rect.left, window.innerWidth - menu.offsetWidth - 8))}px`;
  menu.style.top = `${rect.bottom + 4}px`;

  openSortMenu = {menu, backdrop};
  sortButton.classList.add('open');
  sortButton.setAttribute('aria-expanded', 'true');
  menu.querySelector('[aria-checked="true"]').focus({preventScroll: true});
}

function closeSortMenu() {
  if (!openSortMenu) return;
  openSortMenu.menu.remove();
  openSortMenu.backdrop.remove();
  openSortMenu = null;
  unlockScroll();
  sortButton.classList.remove('open');
  sortButton.setAttribute('aria-expanded', 'false');
  sortButton.focus({preventScroll: true});
}

sortButton.addEventListener('click', showSortMenu);

// ── Search all filters ──────────────────────────────────────
const searchWrap = document.getElementById('filter-search');
const searchInput = document.getElementById('filter-search-input');
let searchPanel = null;

function renderSearchPanel() {
  if (!searchPanel) return;
  // Clicking a value focuses its checkbox, which is about to be replaced.
  searchInput.focus({preventScroll: true});
  const list = searchPanel.firstChild;
  const {scrollTop} = list;
  const ul = document.createElement('ul');
  FACETS.forEach(({key, label}) => {
    const matches = matchValues(facetValues(key), searchInput.value);
    if (!matches.length) return;
    if (ul.children.length) ul.append(document.createElement('hr'));
    const category = document.createElement('li');
    category.className = 'filter-search-category';
    category.textContent = label;
    ul.append(category, ...matches.map(match => valueRow(key, match)));
  });
  list.replaceChildren(ul.children.length ? ul : noResults());
  positionSearchPanel();
  list.scrollTop = scrollTop;
}

function positionSearchPanel() {
  const rect = searchInput.getBoundingClientRect();
  const top = rect.bottom + 8;
  searchPanel.style.left = `${rect.left}px`;
  searchPanel.style.top = `${top}px`;
  searchPanel.firstChild.style.maxHeight = `${window.innerHeight - top - 1}px`;
}

function showSearchPanel() {
  if (searchPanel) return;
  searchPanel = document.createElement('div');
  searchPanel.id = 'filter-search-panel';
  searchPanel.className = 'popover popover--filter filter-search-panel';
  searchPanel.setAttribute('role', 'listbox');
  searchPanel.setAttribute('aria-label', 'Filter values');
  const list = document.createElement('div');
  list.className = 'filter-search-list';
  searchPanel.append(list);
  // Keeps focus in the input, so choosing a value leaves the panel open.
  searchPanel.addEventListener('mousedown', e => e.preventDefault());
  searchPanel.addEventListener('focusout', e => {
    if (e.relatedTarget !== searchInput && !searchPanel?.contains(e.relatedTarget)) closeSearchPanel();
  });
  lockScroll();
  document.body.append(searchPanel);
  searchWrap.classList.add('open');
  searchInput.setAttribute('aria-expanded', 'true');
  renderSearchPanel();
}

function closeSearchPanel() {
  if (!searchPanel) return;
  searchPanel.remove();
  searchPanel = null;
  unlockScroll();
  searchInput.value = '';
  searchWrap.classList.remove('open', 'has-value');
  searchInput.setAttribute('aria-expanded', 'false');
  searchInput.blur();
}

searchInput.addEventListener('mousedown', showSearchPanel);
searchInput.addEventListener('input', () => {
  searchWrap.classList.toggle('has-value', !!searchInput.value);
  showSearchPanel();
  searchPanel.firstChild.scrollTop = 0;
  renderSearchPanel();
});
searchInput.addEventListener('keydown', e => {
  if (e.key === 'ArrowDown') showSearchPanel();
});
searchInput.addEventListener('blur', e => {
  if (!searchPanel?.contains(e.relatedTarget)) closeSearchPanel();
});
document.getElementById('filter-search-clear').addEventListener('mousedown', e => {
  e.preventDefault();  // keeps focus in the input
  searchInput.value = '';
  searchWrap.classList.remove('has-value');
  renderSearchPanel();
});
window.addEventListener('resize', () => {
  if (searchPanel) positionSearchPanel();
});

document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  closeSearchPanel();
  closeSortMenu();
  closePopover();
});
document.getElementById('filter-clear').addEventListener('click', () => {
  FACETS.forEach(({key}) => selected[key].clear());
  applyFilters();
});

applyFilters();

// Mobile sidebar toggle
const sidebar = document.querySelector('.explore-sidebar');
const overlay = document.getElementById('sidebar-overlay');
document.getElementById('mobile-filter-toggle')?.addEventListener('click', () => {
  sidebar.classList.add('mobile-open');
  overlay.classList.add('open');
});
overlay.addEventListener('click', () => {
  sidebar.classList.remove('mobile-open');
  overlay.classList.remove('open');
});
</script>
{% endblock %}
