{% extends "base.html" %}
{% load static %}
{% block extra_head %}
<link rel="stylesheet" href="{% static 'css/pages/job-list.css' %}">
{% endblock %}

{% block base_content %}
<div class="base-container wide">

  <div class="list-toolbar">
    <h1 class="list-title">Cell Mappings</h1>
    <div class="toolbar-actions">
      <button class="btn-notify" id="btn-notify" title="Notify me when a job completes">
        <span class="material-icons" id="notify-icon">notifications_none</span>
      </button>
      <button class="btn-notify" id="btn-email-notify" title="Email me when a job completes">
        <span class="material-icons" id="email-notify-icon">mail_outline</span>
      </button>
      <a href="{% url 'reference_list' %}" class="base-button">Map new cells</a>
    </div>
  </div>

  <form method="post" action="{% url 'delete_selected_jobs' %}" id="job-list-form">
  {% csrf_token %}
  <table class="job-table">
    <thead>
      <tr>
        <th class="col-check"></th>
        <th class="col-file">File</th>
        <th class="col-date">Uploaded</th>
        <th class="col-ref">Reference</th>
        <th class="col-pstatus">Status</th>
        <th class="col-results">Results</th>
      </tr>
    </thead>
    <tbody id="job-tbody"></tbody>
  </table>

  <div class="list-footer">
    <button type="submit" class="btn-delete" disabled>Delete selected</button>
  </div>
  </form>
</div>

<div id="popover-root"></div>

{{ initial_state_data|json_script:"initial-state" }}
<script type="module" src="{% static 'jobs/js/list/app.js' %}"></script>
{% endblock %}
