{% extends "base.html" %}
{% load static %}

{% block title %}{{ name }} — UCSC Brain Explorer{% endblock %}

{% block extra_head %}
<link rel="stylesheet" href="{% static 'css/pages/reference-visualization.css' %}">
{% endblock %}

{% block base_content %}
<iframe
  id="ref-visualization"
  class="ref-visualization"
  allow="fullscreen"
  loading="lazy"
  referrerpolicy="strict-origin-when-cross-origin"
  sandbox="allow-scripts allow-same-origin"
  src="{{ src }}"
  title="Brain Explorer Visualization"></iframe>
<script>
document.addEventListener('mousedown', function() {
  var iframe = document.getElementById('ref-visualization');
  if (iframe && iframe.contentWindow) {
    iframe.contentWindow.postMessage('parent-mousedown', '*');
  }
});
</script>
{% endblock %}
